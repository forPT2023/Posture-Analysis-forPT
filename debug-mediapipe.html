<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaPipe 診断ツール</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .status-box {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .status-item {
            display: flex;
            align-items: center;
            padding: 10px;
            margin: 5px 0;
            border-radius: 4px;
        }
        .status-item.loading {
            background: #FFF3CD;
        }
        .status-item.success {
            background: #D4EDDA;
        }
        .status-item.error {
            background: #F8D7DA;
        }
        .icon {
            font-size: 24px;
            margin-right: 15px;
        }
        h1 {
            color: #333;
        }
        pre {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
        }
        .btn {
            background: #2196F3;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn:hover {
            background: #1976D2;
        }
    </style>
</head>
<body>
    <h1>🔍 MediaPipe 診断ツール</h1>
    
    <div class="status-box">
        <h2>ライブラリ読み込み状態</h2>
        <div id="statusContainer"></div>
    </div>
    
    <div class="status-box">
        <h2>エラーログ</h2>
        <pre id="errorLog">エラーなし</pre>
    </div>
    
    <div class="status-box">
        <h2>テスト実行</h2>
        <button class="btn" onclick="testMediaPipe()">MediaPipe初期化テスト</button>
        <div id="testResult" style="margin-top: 15px;"></div>
    </div>

    <script>
        const errors = [];
        const originalConsoleError = console.error;
        console.error = function(...args) {
            errors.push(args.join(' '));
            updateErrorLog();
            originalConsoleError.apply(console, args);
        };

        function updateErrorLog() {
            document.getElementById('errorLog').textContent = 
                errors.length > 0 ? errors.join('\n\n') : 'エラーなし';
        }

        function addStatus(message, status) {
            const container = document.getElementById('statusContainer');
            const statusItem = document.createElement('div');
            statusItem.className = `status-item ${status}`;
            
            let icon = '⏳';
            if (status === 'success') icon = '✅';
            if (status === 'error') icon = '❌';
            
            statusItem.innerHTML = `
                <span class="icon">${icon}</span>
                <span>${message}</span>
            `;
            container.appendChild(statusItem);
        }

        // ライブラリチェック
        addStatus('window.Pose をチェック中...', 'loading');
        
        setTimeout(() => {
            if (typeof Pose !== 'undefined') {
                addStatus('window.Pose: 利用可能 ✓', 'success');
            } else {
                addStatus('window.Pose: 見つかりません ✗', 'error');
            }
        }, 2000);

        setTimeout(() => {
            if (typeof Camera !== 'undefined') {
                addStatus('window.Camera: 利用可能 ✓', 'success');
            } else {
                addStatus('window.Camera: 見つかりません (オプション)', 'loading');
            }
        }, 2500);

        setTimeout(() => {
            if (typeof drawConnectors !== 'undefined') {
                addStatus('window.drawConnectors: 利用可能 ✓', 'success');
            } else {
                addStatus('window.drawConnectors: 見つかりません (オプション)', 'loading');
            }
        }, 3000);

        function testMediaPipe() {
            const resultDiv = document.getElementById('testResult');
            resultDiv.innerHTML = '<p>⏳ MediaPipe Poseを初期化中...</p>';
            
            try {
                if (typeof Pose === 'undefined') {
                    resultDiv.innerHTML = '<p style="color: red;">❌ Poseクラスが見つかりません</p>';
                    return;
                }

                const pose = new Pose({
                    locateFile: (file) => {
                        return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
                    }
                });

                pose.setOptions({
                    modelComplexity: 1,
                    smoothLandmarks: true,
                    enableSegmentation: false,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });

                resultDiv.innerHTML = '<p style="color: green;">✅ MediaPipe Pose初期化成功！</p>';
                
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">❌ エラー: ${error.message}</p>`;
                console.error('MediaPipe初期化エラー:', error);
            }
        }
    </script>

    <!-- MediaPipe ライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
</body>
</html>

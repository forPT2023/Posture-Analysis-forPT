<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>実際のレイアウトテスト</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .test-container { 
            border: 3px solid red; 
            width: 210mm; /* A4縦向き幅 */
            height: 297mm;
            padding: 20mm;
            box-sizing: border-box;
            margin: 20px auto;
        }
        .comparison-area {
            display: flex;
            flex-direction: row !important;
            gap: 10px;
            border: 2px solid blue;
            padding: 10px;
        }
        .comparison-item {
            flex: 0 0 auto;
            border: 2px solid green;
            width: fit-content;
            display: flex;
            flex-direction: column;
        }
        .comparison-canvas-wrapper {
            flex: 0 0 auto;
            width: fit-content;
            margin: 0 auto;
            background: #f9f9f9;
        }
        canvas {
            display: block;
            border: 2px solid orange;
        }
        .info { background: #ffffcc; padding: 10px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>A4縦向きレイアウトテスト</h1>
    <div class="info">
        <strong>A4縦向き:</strong> 210mm × 297mm<br>
        <strong>各画像設計値:</strong> 95mm × 220mm = 359px × 832px
    </div>
    
    <div class="test-container">
        <h2>テスト: Before/After横並び</h2>
        <div class="comparison-area">
            <div class="comparison-item">
                <div class="comparison-canvas-wrapper">
                    <canvas id="canvas1" width="359" height="832" style="background: #ffcccc;">Before</canvas>
                </div>
            </div>
            <div class="comparison-item">
                <div class="comparison-canvas-wrapper">
                    <canvas id="canvas2" width="359" height="832" style="background: #ccffcc;">After</canvas>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const canvas1 = document.getElementById('canvas1');
        const canvas2 = document.getElementById('canvas2');
        const ctx1 = canvas1.getContext('2d');
        const ctx2 = canvas2.getContext('2d');
        
        ctx1.fillStyle = '#000';
        ctx1.font = '30px sans-serif';
        ctx1.fillText('Before', 100, 400);
        ctx1.fillText('359px × 832px', 50, 450);
        
        ctx2.fillStyle = '#000';
        ctx2.font = '30px sans-serif';
        ctx2.fillText('After', 100, 400);
        ctx2.fillText('359px × 832px', 50, 450);
        
        setTimeout(() => {
            const item1 = document.querySelector('.comparison-item');
            const computed = window.getComputedStyle(item1);
            alert('comparison-item の実際の幅: ' + computed.width + '\n期待値: 359px (95mm)');
        }, 500);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シンプルテスト</title>
    <link rel="stylesheet" href="css/style.css?v=6.0.0">
    <style>
        body {
            padding: 20px;
            font-family: sans-serif;
        }
        .test-box {
            border: 3px solid red;
            padding: 20px;
            margin: 20px 0;
        }
        .comparison-item {
            background: #e3f2fd;
            padding: 20px;
            border: 2px solid #2196F3;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>シンプルレイアウトテスト</h1>
    
    <div class="test-box">
        <h2>テスト1: CSSのみ（layout-vertical クラス）</h2>
        <div class="comparison-area layout-vertical">
            <div class="comparison-item">Before</div>
            <div class="comparison-item">After</div>
        </div>
    </div>
    
    <div class="test-box">
        <h2>テスト2: インラインスタイル</h2>
        <div class="comparison-area layout-vertical" style="display: flex !important; flex-direction: row !important;">
            <div class="comparison-item">Before</div>
            <div class="comparison-item">After</div>
        </div>
    </div>
    
    <div class="test-box">
        <h2>テスト3: JavaScript設定</h2>
        <div class="comparison-area layout-vertical" id="test3">
            <div class="comparison-item">Before</div>
            <div class="comparison-item">After</div>
        </div>
    </div>
    
    <script>
        const test3 = document.getElementById('test3');
        test3.setAttribute('style', 'display: flex !important; flex-direction: row !important; flex-wrap: nowrap !important;');
        console.log('test3 style設定完了:', test3.getAttribute('style'));
    </script>
    
    <div class="test-box">
        <h2>結果判定</h2>
        <ul>
            <li>横並び（Before | After）→ ✅ 正常</li>
            <li>縦並び（Before<br>After）→ ❌ 問題あり</li>
        </ul>
    </div>
</body>
</html>
